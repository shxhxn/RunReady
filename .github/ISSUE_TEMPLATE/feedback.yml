name: Feedback / request project support
description: Share how RunReady worked for you, suggest an improvement, or request another project type.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying RunReady! Share what helped or what should be improved.
        If a command failed, use the **Project won't run / report an error** form so I get the command and error together.
        This feedback is public; remove private details before posting.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Request support for a project type
        - Suggest an improvement
        - Share what worked well
        - General feedback
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback or request
      description: Describe the project or workflow and how RunReady could help. Screenshots are welcome.
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project type or public example (optional)
      placeholder: React + Vite, Streamlit, Maven, or a public repository URL
  - type: input
    id: environment
    attributes:
      label: RunReady version and operating system (optional)
      placeholder: RunReady 0.2.5, Windows 11
